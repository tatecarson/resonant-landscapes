name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Chromium only. The mobile projects (iphone-13, pixel-7) and the
      # BrowserStack runs stay manual: they need real devices, throttled
      # networks, and audio payloads from the CDN.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright (chromium)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # TEMPORARY: the committed lockfile is missing @emnapi/runtime, an optional
  # dependency of the rolldown wasm binding that npm prunes on darwin-arm64 and
  # therefore never writes from a Mac. This job resolves the tree on Linux so
  # the complete lockfile can be committed; delete it once that has landed.
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: rm -f package-lock.json && npm install --package-lock-only --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-lock
          path: package-lock.json
