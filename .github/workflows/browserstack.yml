name: BrowserStack real devices

# The real-device matrix (rl-06c.6). Manual only: real-device minutes are a
# bounded spend, so this never runs on every push — and by decision
# (rl-06c.7, 2026-09-06) it does not run on a schedule either. There was a
# weekly cron here, removed at af4a49b while rl-dv8 had the job permanently
# red; rl-dv8 has since closed, but the cron stays gone on purpose. The
# matrix answers a "does real hardware decode this" question that does not
# change week to week, seven real-device sessions per run is a spend that
# wants an occasion, and runs happen when Tate wants one: this workflow's
# dispatch button, or `npm run browserstack:real-devices` from a desk.
#
# Requires the repository secrets BROWSERSTACK_USERNAME and
# BROWSERSTACK_ACCESS_KEY. workflow_dispatch is only offered from the default
# branch, which is where this file lands once merged.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to walk (a deploy preview, say)"
        required: false
        default: "https://resonant-landscapes.netlify.app"
      # Real-device minutes are the reason this exists. Seven platforms times
      # every test is the whole spend; when the question is about one test —
      # is this row's failure the test itself, or the state the test before
      # it left behind — the rest of the suite is minutes spent learning
      # nothing. Empty runs everything, which is the default this file had.
      test_filter:
        description: "Only run tests whose title matches (Playwright --grep)"
        required: false
        default: ""

concurrency:
  group: browserstack-real-devices
  cancel-in-progress: false

jobs:
  real-devices:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run the real-device suite on BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://resonant-landscapes.netlify.app' }}
          # Through the environment, not interpolated into the script: an
          # input pasted straight into a run: block is a shell injection
          # waiting for someone to type a backtick into a dispatch form.
          TEST_FILTER: ${{ inputs.test_filter }}
        # Two things about these lines, both of which fail quietly if undone.
        # Unquoted: the SDK dispatches on argv, so wrapping the whole
        # invocation in one string matches no command — it prints "Not a
        # valid command" and exits 0, green without having run a test.
        # And --config=, not -c: the SDK's own parser eats the value after
        # a separated flag and forwards a bare "-c" to Playwright, which
        # dies with "option '-c, --config <file>' argument missing".
        # --grep= is written joined for that second reason, not for style.
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npx browserstack-node-sdk playwright test --config=playwright.browserstack.config.ts --grep="$TEST_FILTER"
          else
            npx browserstack-node-sdk playwright test --config=playwright.browserstack.config.ts
          fi
