userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}
framework: playwright

# The real-device matrix (rl-06c.6). One run of this file covers every
# platform below; each is a real device on BrowserStack's cloud, driven by
# playwright.browserstack.config.ts against the URL in PLAYWRIGHT_BASE_URL.
#
# One engine per OS, and not by choice: Playwright on BrowserStack's real
# devices accepts only `chrome` on Android and `safari` on iOS. An earlier
# version of this file asked for Samsung Internet and Firefox on Android and
# got "Invalid 'browser'. Use 'chrome'" from every session. Samsung Internet
# — the default browser on the hardware most Android walkers hold — is a real
# gap in this matrix and cannot be closed here; it would need Appium.
#
# So the axes that remain are the ones worth varying:
#   - iOS version, because WebKit ships with the OS and genuinely differs per
#     major, and because real iOS Safari decodes through AudioToolbox, the
#     proprietary path open-source WebKit lacks
#   - device class, because a phone that decodes an 8-channel file to ~90 MB
#     of PCM can run out of room to do it
# Android version is deliberately not an axis: Chrome updates itself, and
# every Android device here reported the same Chrome build.
#
# What these deliberately do not do: geolocation. The geoLocation capability
# is unsupported for Playwright on real iOS devices, so nothing here depends
# on position spoofing — the walk-in-a-park mechanic stays with the emulated
# profiles and the headed simulators, and field behaviour stays with field
# walking (rl-1u7.8.3, rl-wc3.3).
#
# Seven platforms at parallelsPerPlatform 1 is seven sequential sessions per
# build; scheduled weekly, that is a deliberate, bounded spend.
platforms:
  # Android: Chrome, the engine most walkers already carry. The original
  # platform of this file, kept verbatim.
  - browserName: chrome
    deviceName: Samsung Galaxy S22
    osVersion: 13

  # A non-Samsung OEM, so vendor quirks do not hide behind one manufacturer.
  - browserName: chrome
    deviceName: Google Pixel 7
    osVersion: 13

  # The only Android row that is not a flagship. Same Chrome as the two
  # above, so this is not about the engine: it is whether a budget phone has
  # the memory to decode the 8-channel file at all. The failure this catches
  # is the one a walker meets in a park with the cheapest phone that runs the
  # piece, and no flagship can report it.
  - browserName: chrome
    deviceName: Samsung Galaxy M32
    osVersion: "11.0"

  # Real iOS, one row per WebKit major the support matrix covers: the floor
  # in README.md, then 16, 17 and current. Adjust on BrowserStack's word if
  # a pair is retired.
  - browserName: safari
    deviceName: iPhone 12 Pro
    osVersion: 15
  - browserName: safari
    deviceName: iPhone 13
    osVersion: 16
  - browserName: safari
    deviceName: iPhone 15 Pro Max
    osVersion: 17
  - browserName: safari
    deviceName: iPhone 14
    osVersion: 18

parallelsPerPlatform: 1
browserstackLocal: false

projectName: Resonant-Landscapes
buildName: BrowserStack-Real-Devices

debug: true
networkLogs: true
testObservability: true

playwrightConfigOptions:
  use:
    baseURL: ${PLAYWRIGHT_BASE_URL}
