<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- The walk's own mark, not Vite's. Generated by scripts/make-icons.py. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <!-- iOS ignores the manifest icons for a home-screen install and reads this
       one, which is why it is a separate opaque PNG rather than a size in the
       manifest list. -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <!-- Matches the park strip, so the browser chrome does not sit as a white
       band above a walk that is otherwise all cream and green. -->
  <meta name="theme-color" content="#8ecdc0" />
  <!-- Zoom stays available: this is read outdoors in glare at 9-12px, and
       blocking it fails WCAG 1.4.4. viewport-fit=cover is what makes the
       env(safe-area-inset-*) padding already written into the park strip
       resolve above 0 on a notched iPhone. -->
  <meta name="viewport" content="initial-scale=1.0, width=device-width, viewport-fit=cover">
  <!-- The audio CDN, where the 10-25 MB park payloads live. The connection to
       it was previously negotiated cold at the moment a walker came into
       prefetch range — the one moment the bandwidth is already spoken for. -->
  <link rel="preconnect" href="https://resonant-landscapes.b-cdn.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded without blocking the first render: the walk is legible in the
       fallback stack, and holding the map back for a webfont is the wrong
       trade outdoors on cellular. The media/onload swap is the portable form;
       noscript covers scripting being off. -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono&display=swap">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono&display=swap">
  </noscript>
  <!-- <script src="https://cdn.jsdelivr.net/npm/react-render-tracker" data-config="inpage:true"></script> -->
  <!-- <script src="http://138.247.242.164:8097"></script> -->
  <!-- <script src="http://localhost:8097"></script> -->
  <title>Resonant Landscapes</title>
  <!-- What the walk looks like when someone sends the link to someone else,
       which is how a piece meant to be walked with other people spreads. -->
  <meta name="description"
        content="A sound walk. Recordings of South Dakota state parks, placed on the ground where you walk." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Resonant Landscapes" />
  <meta property="og:description"
        content="A sound walk. Recordings of South Dakota state parks, placed on the ground where you walk." />
  <meta property="og:url" content="https://resonant-landscapes.netlify.app/" />
  <meta property="og:image" content="https://resonant-landscapes.netlify.app/icons/og-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
