<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Colours here are the palette's, spelled out.

    An SVG imported for its URL and handed to OpenLayers as an icon `src` is
    fetched as a document of its own: it has no access to the page's `:root`,
    so a `var()` reference to the palette's custom properties resolves to
    nothing and the shape renders black. These
    literals are the one place in the app that has to repeat a token's value
    rather than reference it, and src/theme/palette.test.ts checks every one of
    them against src/theme/palette.js so they cannot drift.
  -->
  <defs>
    <filter id="markerShadow" x="10" y="10" width="76" height="82" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0b1a16" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#markerShadow)">
    <path d="M48 14L56.5 39.5L48 35L39.5 39.5L48 14Z" fill="#21493e"/>
    <circle cx="48" cy="52" r="25" fill="#f6f1e7" fill-opacity="0.98"/>
    <circle cx="48" cy="52" r="21.75" stroke="#21493e" stroke-width="6.5"/>
    <circle cx="48" cy="52" r="7" fill="#d98962"/>
  </g>
</svg>
