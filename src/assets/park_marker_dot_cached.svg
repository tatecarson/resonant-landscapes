<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cachedDotShadow" x="8" y="8" width="56" height="56" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#17312A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!--
    The unheard park with the held marker: the ordinary dot plus a quiet
    outer ring. The ring says the recording is on the phone and will play
    with no signal; the dot underneath is unchanged, because whether it was
    heard is a separate question with its own marker. The ring uses the dot's
    own cream so the two read as one object at 118 m across a phone screen.
  -->
  <g filter="url(#cachedDotShadow)">
    <circle cx="36" cy="36" r="22" stroke="#F6F1E7" stroke-width="3" opacity="0.9"/>
    <circle cx="36" cy="36" r="12" fill="#3F7A63"/>
    <circle cx="36" cy="36" r="10.5" stroke="#F6F1E7" stroke-width="3"/>
  </g>
</svg>
