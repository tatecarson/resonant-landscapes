<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Colours here are the palette's, spelled out.

    An SVG imported for its URL and handed to OpenLayers as an icon `src` is
    fetched as a document of its own: it has no access to the page's `:root`,
    so a `var()` reference to the palette's custom properties resolves to
    nothing and the shape renders black. These
    literals are the one place in the app that has to repeat a token's value
    rather than reference it, and src/theme/palette.test.ts checks every one of
    them against src/theme/palette.js so they cannot drift.
  -->
  <defs>
    <filter id="dotShadow" x="12" y="12" width="48" height="48" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1a16" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#dotShadow)">
    <circle cx="36" cy="36" r="12" fill="#3f7a63"/>
    <circle cx="36" cy="36" r="10.5" stroke="#f6f1e7" stroke-width="3"/>
  </g>
</svg>
