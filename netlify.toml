[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints these filenames, so a changed file is a changed URL and the
# old one can be cached forever. Without this they were revalidated on every
# visit — over cellular, outdoors, before the walk starts.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry point must not be cached, or a deploy never reaches anyone holding
# a stale index.html pointing at assets that no longer exist.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker decides which build everyone else is running, so it is
# the one file that must never be served from a cache. Modern browsers already
# revalidate a worker script on their own, but this is not a place to rely on
# that: a worker held for a day is a deploy that reaches nobody for a day, and
# the failure is silent because the stale build works fine.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same reasoning, smaller stakes: a stale manifest means a home screen icon or
# a name that no longer matches the walk.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
