[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints these filenames, so a changed file is a changed URL and the
# old one can be cached forever. Without this they were revalidated on every
# visit — over cellular, outdoors, before the walk starts.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry point must not be cached, or a deploy never reaches anyone holding
# a stale index.html pointing at assets that no longer exist.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
