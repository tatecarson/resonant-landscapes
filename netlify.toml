[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints these filenames, so a changed file is a changed URL and the
# old one can be cached forever. Without this they were revalidated on every
# visit — over cellular, outdoors, before the walk starts.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers. The site is static with no backend, so this is
# defence-in-depth: it cannot stop a supply-chain compromise of a build
# dependency, but it can keep an injected script from reading the CDN's
# cookies (there are none), phoning home, or the walk being framed by
# someone else's page.
#
# The CSP's allowlist is the exact set of origins the walk already talks
# to: the app itself, Stadia's map tiles, the audio CDN, and Google Fonts
# (stylesheet from googleapis, files from gstatic). Anything else a build
# dependency starts fetching will be blocked and visible in the console,
# which is the point.
#
# script-src allows one inline event handler by hash ('unsafe-hashes' +
# 'sha256-…'): the media/onload font swap in index.html. Every other
# script must come from the origin. Safari 15.0–15.4 does not implement
# unsafe-hashes and will silently drop that handler, so those few
# browsers fall back to the font stack the stylesheet is designed to sit
# on top of — the same degradation as scripting-off, accepted by the
# loading strategy comment in index.html.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tiles.stadiamaps.com; media-src 'self' blob: https://resonant-landscapes.b-cdn.net; connect-src 'self' https://resonant-landscapes.b-cdn.net https://tiles.stadiamaps.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # geolocation=(self): the walk's core permission, asked for by the
    # first-party page and nothing else. wake-lock is deliberately absent:
    # keep-awake is a feature, and its default allowlist is already 'self'.
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"

# The entry point must not be cached, or a deploy never reaches anyone holding
# a stale index.html pointing at assets that no longer exist.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker decides which build everyone else is running, so it is
# the one file that must never be served from a cache. Modern browsers already
# revalidate a worker script on their own, but this is not a place to rely on
# that: a worker held for a day is a deploy that reaches nobody for a day, and
# the failure is silent because the stale build works fine.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same reasoning, smaller stakes: a stale manifest means a home screen icon or
# a name that no longer matches the walk.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers (rl-6dt, from the rl-snp deep scan). A static site with no
# backend, so these are defence in depth rather than a fix for anything known.
#
# Every value below was tested against a real production build served with
# these exact headers, not reasoned about — which is the only reason the two
# surprises in here were found rather than shipped:
#
#   1. script-src needs 'unsafe-eval'. Resonance Audio evaluates a string as
#      JavaScript while building the ambisonic scene, so without it the walk
#      loads, looks fine, and has no sound at all. It is the weakening nobody
#      wants and the library is archived upstream, so it cannot be fixed here
#      — only noticed. Everything else stays strict to keep it worth having.
#   2. Permissions-Policy cannot be "geolocation and nothing else". The walk
#      is a compass: it reads deviceorientation, which Chrome gates behind
#      accelerometer, gyroscope and magnetometer, and it holds a wake lock so
#      the screen does not sleep mid-park. Turning those off would have
#      disabled the mechanic the piece is made of.
#
# Adding an origin means adding it here. The one place that bites is the
# commented-out react-render-tracker tag in index.html: uncomment it and it
# will be blocked until cdn.jsdelivr.net is in script-src.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tiles.stadiamaps.com; connect-src 'self' https://resonant-landscapes.b-cdn.net https://tiles.stadiamaps.com; worker-src 'self'; manifest-src 'self'; media-src 'self'"
    X-Content-Type-Options = "nosniff"
    # frame-ancestors above is the one browsers honour now; this is for the
    # ones that do not read it.
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), screen-wake-lock=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
